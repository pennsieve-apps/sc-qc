# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: Single-cell QC
  description: >-
    Quality control of single-cell and single-nucleus RNA-seq samples, the step after sc-prep in the
    single-cell workflows (10x 3'/5', Flex, Multiome RNA; any tissue, human/mouse/rat). Per sample:
    removes ambient RNA with CellBender (Fleming et al. 2023) when the raw droplet matrix is linked
    (on a GPU by default), flags outlier cells by median absolute deviations of counts, genes and the
    top-20-gene share plus a mitochondrial cap suited to nuclei (Heumos et al. 2023), detects doublets
    with Scrublet (Wolock et al. 2019), removes the flagged cells, and log-normalizes (normalize_total +
    log1p) with the counts kept in layers. Writes the filtered cells/<sample_id>.h5ad plus qc/ tables
    (every cell's metrics and why it was removed), summary.json and figures.
  type: processor
  tags:
    - single-cell
    - single-nucleus
    - transcriptomics
    - genomics
    - multiome
    - quality-control
    - ambient-rna
    - doublet-detection
    - normalization
    - neuroscience
    - pain
    - musculoskeletal
runtime:
  # Shared by both variants (below); these are the cpu variant's values. One sample at a time. See
  # README "Runtime": without CellBender the drg-c2 demo (12 Flex samples, <= 3,000 nuclei each) runs in
  # minutes under 1.5 GB; CellBender on CPU takes about an hour per sample and peaks at ~4 GB, so the cpu
  # variant runs it only when asked (AMBIENT=cellbender).
  cpu: 4096
  memory: 16384
  computeTypes:
    - standard
  timeoutSeconds: 28800
parameters:
  - name: AMBIENT
    type: string
    label: Ambient RNA removal
    description: >-
      auto: CellBender remove-background on every sample with a raw droplet matrix when the step has a
      GPU (the gpu variant); without a GPU it is skipped with a warning (CellBender takes about an hour
      per sample on CPU). cellbender: always run it, also on CPU, and fail the sample when it fails.
      none: never. Samples without a raw matrix are never corrected.
    defaultValue: auto
    validValues: [auto, cellbender, none]
  - name: AMBIENT_EPOCHS
    type: integer
    label: CellBender epochs
    description: CellBender training epochs (its default and recommendation is 150).
    defaultValue: 150
    min: 1
    max: 1000
  - name: AMBIENT_FPR
    type: number
    label: CellBender false positive rate
    description: >-
      CellBender --fpr: the fraction of real signal it may remove along with the background (0.01 is
      its default; higher removes more ambient RNA and more signal).
    defaultValue: 0.01
    min: 0.0001
    max: 0.9
  - name: DOUBLETS
    type: string
    label: Doublets
    description: >-
      remove: cells Scrublet calls doublets are removed. flag: they are kept, with
      obs["predicted_doublet"] = true, for a later decision.
    defaultValue: remove
    validValues: [remove, flag]
  - name: DOUBLET_RATE
    type: number
    label: Expected doublet rate
    description: >-
      Scrublet's expected doublet rate (scanpy's default 0.05). About 0.008 per 1,000 cells loaded for
      10x Chromium; lower for Flex multiplexed runs.
    defaultValue: 0.05
    min: 0.001
    max: 0.49
  - name: MADS
    type: number
    label: MADs
    description: >-
      A cell is an outlier when log1p(total counts) or log1p(genes detected) is more than MADS median
      absolute deviations from the sample's median (either side), or its share of counts in the 20 top
      genes is more than MADS MADs above the median. 5 is the permissive value of sc-best-practices.
    defaultValue: 5
    min: 0.5
    max: 50
  - name: MAX_PCT_MT
    type: number
    label: Maximum % mitochondrial counts
    description: >-
      Cells with a higher percentage of mitochondrial counts are removed. 5 suits nuclei (snRNA-seq,
      Flex on nuclei, Multiome), whose mitochondrial reads are mostly cytoplasmic contamination; use
      10-20 for whole cells, more for muscle or heart.
    defaultValue: 5
    min: 0
    max: 100
  - name: TARGET_SUM
    type: number
    label: Normalization target sum
    description: Counts per cell after normalize_total, before log1p; the same for every sample (10000 = CP10k).
    defaultValue: 10000
    min: 1
  - name: SEED
    type: integer
    description: Random seed for Scrublet's simulated doublets and PCA.
    defaultValue: 42
  - name: THREADS
    type: integer
    label: Threads
    description: BLAS / numba / CellBender CPU threads; 0 = from the container's CPU quota.
    defaultValue: 0
    min: 0
    max: 64
# Each input in its own folder (placement: subfolder) when linked; without links the files are found by
# name anywhere under INPUT_DIR.
inputs:
  - name: cells
    description: >-
      sc-prep's <sample_id>.h5ad, one per sample: raw UMI counts in X (CSR), obs_names
      <sample_id>:<barcode>, var["gene_ids"], var["mt"], uns["pennsieve"].
    formats:
      - format_3590
    mediaTypes:
      - application/x-hdf5
    placement: subfolder
    required: true
  - name: droplets
    description: >-
      Optional: sc-prep's <sample_id>.raw.h5, the raw (unfiltered) 10x feature-barcode matrix of the
      sample, for ambient RNA removal. Samples without one are not corrected (with a warning).
    formats:
      - format_3590
    mediaTypes:
      - application/x-hdf5
    placement: subfolder
    required: false
outputs:
  - name: cells
    description: >-
      cells/<sample_id>.h5ad: the kept cells in input order and every gene; X log-normalized float32 CSR,
      layers["counts"] (after ambient removal when it ran), layers["counts_raw"] (sc-prep's counts, when
      CellBender ran), obs QC metrics of the written counts, doublet_score, predicted_doublet,
      ambient_fraction and cellbender_cell_probability (when CellBender ran),
      uns["pennsieve"]["qc"]; cells/provenance.json.
    formats:
      - format_3590
    mediaTypes:
      - application/x-hdf5
      - application/json
  - name: qc
    description: >-
      qc/<sample_id>_qc.csv (every input cell: metrics, ambient fraction, doublet score, kept, reason),
      qc/qc_summary.csv (per sample: n_cells_before, n_cells_after, n_removed_<reason> for ambient_empty,
      low/high_counts, low/high_genes, high_top20, high_mito, doublet; ambient_method; medians, doublet
      threshold), qc/thresholds.csv, qc/<sample_id>_qc.png (counts, genes, % mito before/after;
      counts vs genes), qc/<sample_id>_doublets.png, qc/<sample_id>_ambient.png and
      qc/<sample_id>_cellbender_metrics.csv (when CellBender ran), qc/summary.json, qc/provenance.json.
    mediaTypes:
      - text/csv
      - image/png
      - application/json
variants:
  - id: cpu
    name: CPU
    default: true
    description: >-
      CPU-only PyTorch on a standard task; QC, doublets and normalization in minutes, ambient RNA
      removal only with AMBIENT=cellbender (about an hour per sample).
    build:
      args:
        TORCH_FLAVOUR: cpu
    runtime:
      computeTypes: [standard]
  - id: gpu
    name: GPU (CellBender)
    description: >-
      CUDA PyTorch on an NVIDIA GPU (T4 or newer); runs CellBender on every sample with a raw droplet
      matrix (minutes per sample).
    build:
      args:
        TORCH_FLAVOUR: cuda
    runtime:
      computeTypes: [gpu]
      memory: 14336
